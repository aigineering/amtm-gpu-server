---
# Agentless: this inventory only needs SSH reachability, nothing runs persistently
# on the target beyond what the playbook explicitly installs.
all:
  children:
    gpu_servers:
      hosts:
        aws-test-l40s:
          # Set to the Elastic IP printed by `infra/env.sh up` (stable across
          # resets and stop/start, so this only needs to be set once).
          ansible_host: CHANGEME
          ansible_user: ec2-user
          # Relative to the ansible/ dir (where ansible.cfg lives and runs happen).
          ansible_ssh_private_key_file: ../.ssh/aws_key
          ansible_connection: ssh
