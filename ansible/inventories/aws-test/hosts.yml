---
# Agentless: this inventory only needs SSH reachability, nothing runs persistently
# on the target beyond what the playbook explicitly installs.
all:
  children:
    gpu_servers:
      hosts:
        aws-test-l40s:
          ansible_host: CHANGEME.compute.amazonaws.com
          ansible_user: ec2-user
          ansible_ssh_private_key_file: ~/.ssh/CHANGEME.pem
          ansible_connection: ssh
