---
# Clean, disposable AWS box: safe to install/manage everything from scratch.
nvidia_driver_manage: true
nvidia_driver_min_version: "550"
nvidia_driver_target_version: "550"

docker_manage: true
firewalld_manage: true
selinux_manage: true

vllm_deploy_dir: /opt/vllm

# Model repos are already present on the host as full local copies (config.json,
# tokenizer files, safetensors) — nothing is downloaded. See
# docs/model-tuning-and-placement.md for the expected layout and the chat-focused
# flags used in extra_args below.
vllm_instances:
  - name: gemma
    model_path: "/opt/models/gemma-4-26b-a4b"  # CHANGEME: local path to the full model repo
    port: 8001
    gpu_memory_utilization: 0.6
    max_model_len: 8192
    extra_args:
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"

  - name: llama
    model_path: "/opt/models/llama-3.2-3b-instruct"  # CHANGEME: local path to the full model repo
    port: 8002
    gpu_memory_utilization: 0.3
    max_model_len: 8192
    extra_args:
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"
