---
# Clean, disposable AWS box: safe to install/manage everything from scratch.
nvidia_driver_manage: true
nvidia_driver_min_version: "550"
nvidia_driver_target_version: "550"

docker_manage: true
firewalld_manage: true
selinux_manage: true

vllm_deploy_dir: /opt/vllm

# Only used by playbooks/fetch-models.yml (never by the main site.yml apply). Set
# model_fetch_hf_token via ansible-vault (group_vars/vault.yml -> vault_hf_token) —
# see docs/model-fetching.md. This box is disposable, so re-fetching is cheap; leave
# model_fetch_force false unless you deliberately want to redownload.
model_fetch_hf_token: "{{ vault_hf_token | default('') }}"
model_fetch_force: false

# Model repos are expected to already be present on the host as full local copies
# (config.json, tokenizer files, safetensors) before the vllm role runs — it never
# downloads anything. repo_id/revision below are only read by
# playbooks/fetch-models.yml to populate model_path in the first place. See
# docs/model-tuning-and-placement.md (layout/tuning) and docs/model-fetching.md
# (how repo_id gets turned into model_path).
# GPU split (L40S, ~45 GiB usable): gemma's AWQ weights alone are ~16.6 GiB and
# vLLM needs profiling/cudagraph headroom on top, so 0.6 left negative KV cache
# memory at startup. 0.68 ≈ 30.6 GiB gives ~10 GiB of KV; llama (2.3 GiB weights)
# is comfortable at 0.2 ≈ 9 GiB (~6 GiB KV ≈ 7 concurrent 8k-token chats).
# --limit-mm-per-prompt on gemma: image INPUT (understanding) allowed, up to 2
# per prompt; video disabled — profiling the video-encoder path at startup is
# what burned several GiB of activation headroom. Image profiling costs some
# KV headroom too; if startup goes negative again, drop to image: 1 or raise
# gemma's utilization. See docs/model-tuning-and-placement.md.
vllm_instances:
  - name: gemma
    model_path: "/opt/models/gemma-4-26b-a4b-it-awq-4bit"
    repo_id: "cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit"
    revision: main
    port: 8001
    gpu_memory_utilization: 0.68
    max_model_len: 8192
    extra_args:
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"
      - "--limit-mm-per-prompt"
      - '{"image": 2, "video": 0}'

  - name: llama
    model_path: "/opt/models/llama-3.2-3b-instruct-awq-int4"
    repo_id: "cyankiwi/Llama-3.2-3B-Instruct-AWQ-INT4"
    revision: main
    port: 8002
    gpu_memory_utilization: 0.2
    max_model_len: 8192
    extra_args:
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"
