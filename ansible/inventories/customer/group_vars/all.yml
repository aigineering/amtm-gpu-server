---
# Customer server: may already have a driver, Docker, firewalld config, and SELinux
# policy in place from before Ansible ever touched it. Every *_manage flag below
# defaults to false (detect-and-report only) until confirmed against the real host.
# See docs/host-safety-model.md before flipping any of these to true.
nvidia_driver_manage: false
nvidia_driver_min_version: "CHANGEME"       # fill in from `nvidia-smi` on the real host
nvidia_driver_target_version: "550"

docker_manage: false      # confirm existing Docker/toolkit state before enabling
firewalld_manage: false   # confirm firewalld is actually the host's firewall mechanism
selinux_manage: false     # confirm with the server owner before flipping SELinux booleans

vllm_deploy_dir: /opt/vllm

# API key required on /v1/* when set (vault_vllm_api_key in vault.yml).
# Decide with the customer whether their network layer already restricts
# access or the app-level key is wanted too.
vllm_api_key: "{{ vault_vllm_api_key | default('') }}"

# Only used by playbooks/fetch-models.yml (never by the main site.yml apply), and
# only during a window the customer's IT team has explicitly opened this host's
# egress for. Set model_fetch_hf_token via ansible-vault
# (group_vars/vault.yml -> vault_hf_token) — see docs/model-fetching.md.
model_fetch_hf_token: "{{ vault_hf_token | default('') }}"
model_fetch_force: false

# Full model catalog fetched by playbooks/fetch-models.yml (~150GB — confirm
# disk space AND the egress window is long enough before running against this
# host; see docs/model-fetching.md). Everything lands in one window so serving
# profiles can swap models/quantizations without needing the network again.
# /opt/models paths: confirm with the customer before fetching. bge-m3 is an
# embedding model (not served by the vllm role) — fetched for later use.
model_fetch_repos:
  - name: gemma-4-31b-it-awq
    repo_id: "QuantTrio/gemma-4-31B-it-AWQ"
    model_path: "/opt/models/gemma-4-31b-it-awq"
    revision: main
  - name: gemma-4-31b-it-awq-4bit
    repo_id: "cyankiwi/gemma-4-31B-it-AWQ-4bit"
    model_path: "/opt/models/gemma-4-31b-it-awq-4bit"
    revision: main
  - name: gemma-4-31b-it-fp8-block
    repo_id: "RedHatAI/gemma-4-31B-it-FP8-block"
    model_path: "/opt/models/gemma-4-31b-it-fp8-block"
    revision: main
  - name: gemma-4-31b-it-fp8-dynamic
    repo_id: "RedHatAI/gemma-4-31B-it-FP8-Dynamic"
    model_path: "/opt/models/gemma-4-31b-it-fp8-dynamic"
    revision: main
  - name: gemma-4-26b-a4b-it-fp8-dynamic
    repo_id: "RedHatAI/gemma-4-26B-A4B-it-FP8-Dynamic"
    model_path: "/opt/models/gemma-4-26b-a4b-it-fp8-dynamic"
    revision: main
  - name: gemma-4-26b-a4b-it-awq-4bit
    repo_id: "cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit"
    model_path: "/opt/models/gemma-4-26b-a4b-it-awq-4bit"
    revision: main
  - name: llama-3.2-3b-instruct-awq-int4
    repo_id: "cyankiwi/Llama-3.2-3B-Instruct-AWQ-INT4"
    model_path: "/opt/models/llama-3.2-3b-instruct-awq-int4"
    revision: main
  - name: meta-llama-3.1-8b-instruct-awq-int4
    repo_id: "hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4"
    model_path: "/opt/models/meta-llama-3.1-8b-instruct-awq-int4"
    revision: main
  - name: bge-m3
    repo_id: "BAAI/bge-m3"
    model_path: "/opt/models/bge-m3"
    revision: main

# Model repos are expected to already be present on the host as full local copies
# (config.json, tokenizer files, safetensors) before the vllm role runs — it never
# downloads anything. Confirm the real model_path with the customer before deploying.
# repo_id/revision are only read by playbooks/fetch-models.yml to populate
# model_path in the first place. See docs/model-tuning-and-placement.md
# (layout/tuning) and docs/model-fetching.md (fetch process).
vllm_instances:
  - name: gemma
    model_path: "CHANGEME"  # local path to the full model repo on this host
    repo_id: "cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit"
    revision: main
    port: 8001
    # 0.6 proved too small on the L40S test box (16.6 GiB AWQ weights + profiling
    # headroom left negative KV memory); 0.68 + text-only mm limits is the
    # validated split. See docs/model-tuning-and-placement.md.
    gpu_memory_utilization: 0.68
    max_model_len: 8192
    extra_args:
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"
      - "--limit-mm-per-prompt"
      - '{"image": 2, "video": 0}'

  - name: llama
    model_path: "CHANGEME"  # local path to the full model repo on this host
    repo_id: "cyankiwi/Llama-3.2-3B-Instruct-AWQ-INT4"
    revision: main
    port: 8002
    gpu_memory_utilization: 0.2
    max_model_len: 8192
    extra_args:
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"
