---
# Customer server: may already have a driver, Docker, firewalld config, and SELinux
# policy in place from before Ansible ever touched it. Every *_manage flag below
# defaults to false (detect-and-report only) until confirmed against the real host.
# See docs/host-safety-model.md before flipping any of these to true.
nvidia_driver_manage: false
nvidia_driver_min_version: "CHANGEME"       # fill in from `nvidia-smi` on the real host
nvidia_driver_target_version: "550"

docker_manage: false      # confirm existing Docker/toolkit state before enabling
firewalld_manage: false   # confirm firewalld is actually the host's firewall mechanism
selinux_manage: false     # confirm with the server owner before flipping SELinux booleans

vllm_deploy_dir: /opt/vllm
vllm_hf_token: "CHANGEME"  # override via ansible-vault, never commit a real token

vllm_instances:
  - name: gemma
    model: "CHANGEME/gemma-4-26b-a4b"  # confirm exact HF repo id before deploying
    port: 8001
    gpu_memory_utilization: 0.6
    max_model_len: 8192
    extra_args: []

  - name: llama
    model: "meta-llama/Llama-3.2-3B-Instruct"
    port: 8002
    gpu_memory_utilization: 0.3
    max_model_len: 8192
    extra_args: []
