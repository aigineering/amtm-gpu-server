---
# Serving profile: baseline — the v0.1-validated split on a single L40S.
#
# A profile is a named, versioned serving configuration (models + quantization,
# GPU memory split, context length, extra flags). Apply it with:
#
#   ansible-playbook -i inventories/aws-test/hosts.yml playbooks/site.yml \
#     --tags vllm -e @profiles/baseline.yml
#
# and benchmark it with:
#
#   ansible-playbook -i inventories/aws-test/hosts.yml playbooks/benchmark.yml \
#     -e @profiles/baseline.yml
#
# Extra-vars beat group_vars, so the profile's vllm_instances wins for that run.
# The benchmark records the config actually applied on the host (the rendered
# compose file), not this file — see docs/benchmarking.md "Result record".
profile_name: baseline

vllm_instances:
  - name: gemma
    model_path: "/opt/models/gemma-4-26b-a4b-it-awq-4bit"
    repo_id: "cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit"
    revision: main
    port: 8001
    gpu_memory_utilization: 0.68
    max_model_len: 8192
    extra_args:
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"
      - "--limit-mm-per-prompt"
      - '{"image": 2, "video": 0}'

  - name: llama
    model_path: "/opt/models/llama-3.2-3b-instruct-awq-int4"
    repo_id: "cyankiwi/Llama-3.2-3B-Instruct-AWQ-INT4"
    revision: main
    port: 8002
    gpu_memory_utilization: 0.2
    max_model_len: 8192
    extra_args:
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"
