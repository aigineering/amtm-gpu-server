---
# Stage-1 campaign profile (docs/benchmarking.md): gemma dense 31B AWQ solo,
# 32k context, KV offloading to RAM: ON (24GB). Single instance at 0.9 GPU utilization.
profile_name: solo-gemma-31b-32k-kv

benchmark_scenarios: [solo]

vllm_instances:
  - name: gemma-31b
    model_path: "/opt/models/gemma-4-31b-it-awq-4bit"
    repo_id: "cyankiwi/gemma-4-31B-it-AWQ-4bit"
    revision: main
    port: 8001
    gpu_memory_utilization: 0.9
    max_model_len: 32768
    extra_args:
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"
      # Native CPU KV offloading (vLLM >=0.14 flags). 40GB of the host's 64GB:
      # the RAM tier must exceed the multi-turn working set (~35GB at c50) or
      # it thrashes — measured: 372GB stored, 0.5GB loaded back at 24GB.
      - "--kv-offloading-backend"
      - "native"
      - "--kv-offloading-size"
      - "40"
