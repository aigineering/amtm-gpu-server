---
# Stage-1 campaign profile (docs/benchmarking.md): gemma dense 31B AWQ solo,
# 16k context, KV offloading: OFF. Single instance at 0.9 GPU utilization.
profile_name: solo-gemma-31b-16k

benchmark_scenarios: [solo]

vllm_instances:
  - name: gemma-31b
    model_path: "/opt/models/gemma-4-31b-it-awq-4bit"
    repo_id: "cyankiwi/gemma-4-31B-it-AWQ-4bit"
    revision: main
    port: 8001
    gpu_memory_utilization: 0.9
    max_model_len: 16384
    extra_args:
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"
