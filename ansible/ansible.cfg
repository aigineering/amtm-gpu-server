# Agentless: every task in this repo runs over a plain SSH connection from whichever
# machine invokes ansible-playbook. Nothing persistent is installed on the target to
# make this work (no Ansible agent, no AWX/Tower, no pull-mode cron job) — the control
# machine connects, runs the modules, and disconnects. See docs/host-safety-model.md.
[defaults]
inventory = inventories/aws-test/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
# yaml-formatted output via the builtin callback (the community.general.yaml
# callback plugin was removed in community.general 12)
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent

[ssh_connection]
pipelining = True

[privilege_escalation]
become = True
become_method = sudo
