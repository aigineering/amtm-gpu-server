---
# Performance benchmarking per docs/benchmarking.md. Chat-focused: latency
# percentiles (TTFT/TPOT/ITL/e2e) outrank aggregate throughput. The load
# generator runs ON the GPU host against localhost (never through the SSH
# tunnel), inside the same vLLM image that serves — no extra dependencies.

# Fallback copies of the vllm role's defaults (role defaults are lowest
# precedence, so inventory group_vars override both identically) — the
# benchmark playbook runs without the vllm role in scope. Keep aligned with
# roles/vllm/defaults/main.yml.
vllm_image: "vllm/vllm-openai:latest"
vllm_deploy_dir: /opt/vllm
vllm_api_key: ""

# Where the fetch playbook put the dataset + multi-turn harness (models volume).
benchmark_assets_dir: /opt/models/benchmark

# Host-side scratch dir for this run's raw results; packaged and fetched back
# into benchmarks/results/<run_id>/ in this repo at the end of the play.
benchmark_results_host_dir: /opt/benchmark-results

# Concurrency tiers per docs/benchmarking.md: 1-user floor + the three agreed
# user tiers where SLO pass/fail is judged.
benchmark_concurrency_tiers: [1, 5, 20, 50]

# Prompts per simulated user per run — total num_prompts = tier * this. Large
# enough for stable percentiles at the low tiers, short enough to keep a full
# suite in the tens of minutes.
benchmark_prompts_per_user: 8

benchmark_seed: 42

# Which scenarios to run. 'solo' stops the other instance(s) to measure each
# model's best case; 'colocated' loads all endpoints simultaneously (the run
# that validates the two-models-on-one-GPU claim).
benchmark_scenarios: [solo, colocated]

# Context-stress runs (capacity mapping, docs/benchmarking.md): random
# long-input requests at ~80% of each instance's max_model_len — worst-case
# KV pressure with zero prefix reuse. Answers "does this context window fit,
# at how many users". Fewer prompts per user than sharegpt runs: each request
# is enormous.
benchmark_context_stress: true
benchmark_context_prompts_per_user: 2
benchmark_context_input_fraction: 0.8
benchmark_context_output_len: 256

# Multi-turn conversation benchmark (vLLM's benchmark_serving_multi_turn.py,
# fetched by the fetch playbook). Runs with all instances serving. num_clients
# = concurrent simulated users.
benchmark_multi_turn: true
# Multi-turn sweeps the same user tiers as the other scenarios — cache
# pressure scales with clients, so the high tiers are where KV-offloading
# effects become visible.
benchmark_multi_turn_tiers: "{{ benchmark_concurrency_tiers }}"
# Conversations per client (the harness requires max_active <= total; we
# render a per-tier generation config sized at clients x this factor, so
# clients rotate between conversations with think-time: the reuse-after-idle
# pattern the KV-offloading evaluation depends on).
benchmark_multi_turn_conversations_per_client: 3
# Conversation depth (turns per conversation, uniform range) — raise for the
# deep-conversation / offloading profiles.
benchmark_multi_turn_turns_min: 12
benchmark_multi_turn_turns_max: 18
# Run every conversation to completion. The harness's default early stop ends
# the benchmark when the first client drains — measured effect: 5% of
# conversations completed, 122s runtime, working set below the KV pool, zero
# meaningful offload traffic (fails all the validity criteria in
# docs/benchmarking.md). Full completion pushes the c50 working set to ~3.5x
# the pool, which is what the KV-offloading evaluation needs.
benchmark_multi_turn_no_early_stop: true

# Label recorded in the result record; profiles (ansible/profiles/*.yml)
# override this together with vllm_instances.
profile_name: adhoc

# Part of the run identity alongside the config hash. Bump when MEASUREMENT
# semantics change (workload shape, seeds, harness flags, snapshot timing) so
# old results can't silently satisfy the resume markers of a new methodology.
# History: m1 = initial suite (same-seed artifact, early-stop multi-turn,
# post-loop metrics snapshots); m2 = per-scenario+tier seeds, --no-early-stop,
# in-run snapshots, c0 baseline, kvpool capture.
benchmark_methodology_version: 2
