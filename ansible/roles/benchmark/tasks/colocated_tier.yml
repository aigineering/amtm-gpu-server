---
# One co-located tier: fire a bench container per endpoint in parallel (async,
# poll 0), then wait for all of them. bench_tier is the concurrency PER MODEL —
# tier 20 means 20 simulated users on gemma AND 20 on llama at once.

- name: "Co-located c{{ bench_tier }}: launch bench per endpoint (parallel)"
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network host
      -v /opt/models:/models:ro
      -v {{ benchmark_run_dir }}:/results
      {% if vllm_api_key | length > 0 %}-e OPENAI_API_KEY={{ vllm_api_key }}{% endif %}
      --entrypoint vllm {{ vllm_image }} bench serve
      --backend openai-chat
      --base-url http://localhost:{{ item.port }}
      --endpoint /v1/chat/completions
      --model /models/{{ item.model_path | basename }}
      --served-model-name {{ item.served_model_name | default(item.name) }}
      --dataset-name sharegpt
      --dataset-path /models/benchmark/datasets/sharegpt.json
      --num-prompts {{ bench_tier * benchmark_prompts_per_user }}
      --max-concurrency {{ bench_tier }}
      --seed {{ benchmark_seed | int + bench_tier | int }}
      --percentile-metrics ttft,tpot,itl,e2el
      --metric-percentiles 50,95,99
      --save-result --result-dir /results
      --result-filename colocated-{{ item.name }}-c{{ bench_tier }}.json
    # Resumability: the result file is the completion marker.
    creates: "{{ benchmark_run_dir }}/colocated-{{ item.name }}-c{{ bench_tier }}.json"
  async: 7200
  poll: 0
  changed_when: true
  register: benchmark_colo_jobs
  loop: "{{ vllm_instances }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Co-located c{{ bench_tier }}: wait for all bench runs"
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  register: benchmark_colo_result
  until: benchmark_colo_result.finished
  retries: 480
  delay: 15
  loop: "{{ benchmark_colo_jobs.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  # Jobs skipped by creates: (already-done runs) have no job id to wait on.
  when: item.ansible_job_id is defined

- name: "Co-located c{{ bench_tier }}: snapshot /metrics per endpoint"
  ansible.builtin.shell:
    cmd: >-
      curl -s http://localhost:{{ item.port }}/metrics >
      {{ benchmark_run_dir }}/colocated-{{ item.name }}-c{{ bench_tier }}.metrics.txt
    creates: "{{ benchmark_run_dir }}/colocated-{{ item.name }}-c{{ bench_tier }}.metrics.txt"
  changed_when: true
  loop: "{{ vllm_instances }}"
  loop_control:
    label: "{{ item.name }}"

# Pair capacity mapping: random long inputs against BOTH endpoints at once —
# answers "does <ctx> + two models fit on this GPU, at how many users".
- name: "Context-pair c{{ bench_tier }}: launch long-input bench per endpoint (parallel)"
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network host
      -v /opt/models:/models:ro
      -v {{ benchmark_run_dir }}:/results
      {% if vllm_api_key | length > 0 %}-e OPENAI_API_KEY={{ vllm_api_key }}{% endif %}
      --entrypoint vllm {{ vllm_image }} bench serve
      --backend openai-chat
      --base-url http://localhost:{{ item.port }}
      --endpoint /v1/chat/completions
      --model /models/{{ item.model_path | basename }}
      --served-model-name {{ item.served_model_name | default(item.name) }}
      --dataset-name random
      --random-input-len {{ (item.max_model_len * benchmark_context_input_fraction) | int }}
      --random-output-len {{ benchmark_context_output_len }}
      --num-prompts {{ [bench_tier * benchmark_context_prompts_per_user, 4] | max }}
      --max-concurrency {{ bench_tier }}
      --seed {{ benchmark_seed | int + 2000 + bench_tier | int }}
      --percentile-metrics ttft,tpot,itl,e2el
      --metric-percentiles 50,95,99
      --save-result --result-dir /results
      --result-filename contextpair-{{ item.name }}-c{{ bench_tier }}.json
    creates: "{{ benchmark_run_dir }}/contextpair-{{ item.name }}-c{{ bench_tier }}.json"
  async: 7200
  poll: 0
  changed_when: true
  register: benchmark_ctxpair_jobs
  loop: "{{ vllm_instances }}"
  loop_control:
    label: "{{ item.name }}"
  when: benchmark_context_stress | bool and vllm_instances | length > 1

- name: "Context-pair c{{ bench_tier }}: wait for all runs"
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  register: benchmark_ctxpair_result
  until: benchmark_ctxpair_result.finished
  retries: 480
  delay: 15
  loop: "{{ benchmark_ctxpair_jobs.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('skipped') }}"
  when: item.ansible_job_id is defined
