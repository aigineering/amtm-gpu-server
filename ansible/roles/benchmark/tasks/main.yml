---
# Orchestrates the benchmark suite defined in docs/benchmarking.md: solo
# baselines, the co-located contention run, tier sweep, optional multi-turn.
# Raw results land in {{ benchmark_results_host_dir }}/<run_id>/ on the host
# and are fetched back into benchmarks/results/<run_id>/ in this repo.

- name: Assert there are instances to benchmark
  ansible.builtin.assert:
    that:
      - vllm_instances is defined
      - vllm_instances | length > 0
    fail_msg: >-
      No vllm_instances defined. Pass a profile
      (-e @profiles/<name>.yml) or run against an inventory whose
      group_vars define the serving instances.

- name: Check the benchmark dataset is on the host
  ansible.builtin.stat:
    path: "{{ benchmark_assets_dir }}/datasets/sharegpt.json"
  register: benchmark_dataset_check

- name: Fail if benchmark assets were never fetched
  ansible.builtin.fail:
    msg: >-
      {{ benchmark_assets_dir }}/datasets/sharegpt.json is missing — run
      playbooks/fetch-models.yml (during an egress window) first; it fetches
      the benchmark dataset and multi-turn harness alongside the models.
  when: not benchmark_dataset_check.stat.exists

- name: Snapshot the rendered compose file (the applied config)
  ansible.builtin.slurp:
    src: "{{ vllm_deploy_dir }}/docker-compose.yml"
  register: benchmark_compose_snapshot

# The run id is profile name + hash of the APPLIED config — not a timestamp —
# so re-running the same profile+config lands in the same directory and every
# already-produced result file acts as a completion marker (resumable runs).
# Any config change → new hash → new directory → full re-run; one directory
# can never mix differing configs. To force a redo, delete the run directory
# on the host.
#
# The API key is REDACTED before hashing: it doesn't affect performance, and
# hashing it would invalidate all benchmark history on every key rotation
# (bit us when the CI secret differed from the local vault). This also makes
# the directory suffix equal the renderer's config id, which hashes the same
# redacted snapshot.
- name: Compose the run id
  ansible.builtin.set_fact:
    benchmark_run_id: >-
      {{ profile_name }}-{{ ((benchmark_compose_snapshot.content | b64decode
          | replace(vllm_api_key, 'REDACTED')
          if vllm_api_key | length > 0
          else benchmark_compose_snapshot.content | b64decode)
         | hash('sha256'))[:10] }}
    benchmark_repo_git_sha: "{{ lookup('pipe', 'git -C ' ~ playbook_dir ~ ' rev-parse HEAD') }}"
    benchmark_repo_git_dirty: "{{ (lookup('pipe', 'git -C ' ~ playbook_dir ~ ' status --porcelain') | length) > 0 }}"

- name: Set the run directory fact
  ansible.builtin.set_fact:
    benchmark_run_dir: "{{ benchmark_results_host_dir }}/{{ benchmark_run_id | trim }}"

- name: Create the run directory
  ansible.builtin.file:
    path: "{{ benchmark_run_dir }}"
    state: directory
    mode: "0755"

# The multi-turn harness needs pandas/xlsxwriter, which the vLLM image doesn't
# ship. Installed once per models volume with the CONTAINER's pip (correct
# Python ABI), into a dir the bench containers pick up via PYTHONPATH —
# survives resets and is offline afterwards. Needs PyPI access on first run
# (test box: fine; customer box: only during an egress window).
- name: Check the multi-turn harness requirements file is on the volume
  ansible.builtin.stat:
    path: "{{ benchmark_assets_dir }}/multi_turn/requirements.txt"
  register: benchmark_mt_requirements_check
  when: benchmark_multi_turn | bool

- name: Fail clearly if the harness requirements were never fetched
  ansible.builtin.fail:
    msg: >-
      {{ benchmark_assets_dir }}/multi_turn/requirements.txt is missing — it was
      added to the fetch asset list later than the other harness files, so a
      models volume fetched before then won't have it. Re-run
      playbooks/fetch-models.yml (already-fetched assets are skipped, this
      takes seconds), then re-run the benchmark.
  when:
    - benchmark_multi_turn | bool
    - not benchmark_mt_requirements_check.stat.exists

- name: Check multi-turn harness Python deps are on the models volume
  ansible.builtin.stat:
    path: "{{ benchmark_assets_dir }}/pylibs/pandas"
  register: benchmark_pylibs_check
  when: benchmark_multi_turn | bool

- name: Install multi-turn harness Python deps (one-time per models volume)
  ansible.builtin.command: >-
    docker run --rm -v /opt/models:/models
    --entrypoint pip {{ vllm_image }}
    install --no-cache-dir --target /models/benchmark/pylibs
    -r /models/benchmark/multi_turn/requirements.txt
  changed_when: true
  when:
    - benchmark_multi_turn | bool
    - not benchmark_pylibs_check.stat.exists

# --- Result record: snapshot what is ACTUALLY running (docs/benchmarking.md) —
# (compose snapshot taken above, before the run id was derived from it)

- name: Read the serving image digest
  ansible.builtin.command: >-
    docker image inspect --format
    '{{ '{{' }}json .RepoDigests{{ '}}' }}' {{ vllm_image }}
  register: benchmark_image_digest
  changed_when: false

- name: Read GPU and driver fingerprint
  ansible.builtin.command: nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
  register: benchmark_gpu_fingerprint
  changed_when: false

- name: Read instance type from IMDSv2
  ansible.builtin.shell: |
    set -o pipefail
    TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" \
      -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
    curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
      http://169.254.169.254/latest/meta-data/instance-type
  register: benchmark_instance_type
  changed_when: false
  failed_when: false

- name: Write the result record metadata
  ansible.builtin.copy:
    dest: "{{ benchmark_run_dir }}/metadata.json"
    mode: "0644"
    content: "{{ benchmark_metadata | to_nice_json }}"
    # Keep the original run's timestamp when resuming into an existing dir.
    force: false
  vars:
    benchmark_metadata:
      run_id: "{{ benchmark_run_id | trim }}"
      profile_name: "{{ profile_name }}"
      timestamp_utc: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
      repo_git_sha: "{{ benchmark_repo_git_sha }}"
      repo_git_dirty: "{{ benchmark_repo_git_dirty }}"
      vllm_image: "{{ vllm_image }}"
      vllm_image_digests: "{{ benchmark_image_digest.stdout | from_json }}"
      # The resolved profile as configured for this run…
      vllm_instances: "{{ vllm_instances }}"
      # …and the config actually applied on the host (base64 of the rendered
      # compose file) — the renderer treats differing snapshots as different
      # configurations even under the same profile name. The API key is
      # REDACTED before the snapshot lands in a git-tracked result record.
      compose_file_b64: >-
        {{ (benchmark_compose_snapshot.content | b64decode
            | replace(vllm_api_key, 'REDACTED') | b64encode)
           if (vllm_api_key | length > 0)
           else benchmark_compose_snapshot.content }}
      host:
        instance_type: "{{ benchmark_instance_type.stdout | default('unknown') }}"
        gpu: "{{ benchmark_gpu_fingerprint.stdout | trim }}"
      workload:
        dataset: sharegpt
        dataset_path: "{{ benchmark_assets_dir }}/datasets/sharegpt.json"
        concurrency_tiers: "{{ benchmark_concurrency_tiers }}"
        prompts_per_user: "{{ benchmark_prompts_per_user }}"
        seed: "{{ benchmark_seed }}"
        scenarios: "{{ benchmark_scenarios }}"
        context_stress: "{{ benchmark_context_stress }}"
        context_input_fraction: "{{ benchmark_context_input_fraction }}"
        context_output_len: "{{ benchmark_context_output_len }}"
        multi_turn: "{{ benchmark_multi_turn }}"
        multi_turn_tiers: "{{ benchmark_multi_turn_tiers }}"
        multi_turn_conversations_per_client: "{{ benchmark_multi_turn_conversations_per_client }}"
        multi_turn_turns: "{{ benchmark_multi_turn_turns_min }}-{{ benchmark_multi_turn_turns_max }}"

# The engine prints its KV pool size and max theoretical concurrency at
# startup — the capacity denominators for interpreting every result row.
# Scraped from the container log (last startup wins, in case of restarts).
- name: Capture each instance's KV pool figures from its startup log
  ansible.builtin.shell:
    cmd: >-
      docker logs vllm-{{ item.name }} 2>&1
      | grep -E "GPU KV cache size:|Maximum concurrency for|Available KV cache memory:"
      | tail -3 > {{ benchmark_run_dir }}/kvpool-{{ item.name }}.txt
    creates: "{{ benchmark_run_dir }}/kvpool-{{ item.name }}.txt"
  changed_when: true
  failed_when: false
  loop: "{{ vllm_instances }}"
  loop_control:
    label: "{{ item.name }}"

# --- Scenarios ---------------------------------------------------------------

- name: Run solo baselines
  ansible.builtin.include_tasks: solo.yml
  when: "'solo' in benchmark_scenarios"

- name: Run co-located scenario
  ansible.builtin.include_tasks: colocated.yml
  when: "'colocated' in benchmark_scenarios"

- name: Run multi-turn conversation benchmark
  ansible.builtin.include_tasks: multi_turn.yml
  when: benchmark_multi_turn | bool

# --- Bring results home -------------------------------------------------------

- name: Package the run directory
  ansible.builtin.command:
    cmd: tar -czf /tmp/{{ benchmark_run_id | trim }}.tar.gz -C {{ benchmark_results_host_dir }} {{ benchmark_run_id | trim }}
  changed_when: true

- name: Fetch the results archive to the control machine
  ansible.builtin.fetch:
    src: "/tmp/{{ benchmark_run_id | trim }}.tar.gz"
    dest: "{{ playbook_dir }}/../../benchmarks/results/"
    flat: true

# Plain tar, not the unarchive module: unarchive insists on GNU tar, and the
# control machine is a Mac (BSD tar) — which extracts .tar.gz just fine when
# invoked directly.
- name: Extract the results locally
  ansible.builtin.command:
    cmd: >-
      tar -xzf {{ playbook_dir }}/../../benchmarks/results/{{ benchmark_run_id | trim }}.tar.gz
      -C {{ playbook_dir }}/../../benchmarks/results/
  delegate_to: localhost
  become: false
  changed_when: true

- name: Remove the local archive
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../benchmarks/results/{{ benchmark_run_id | trim }}.tar.gz"
    state: absent
  delegate_to: localhost
  become: false

- name: Point at the results
  ansible.builtin.debug:
    msg: >-
      Results in benchmarks/results/{{ benchmark_run_id | trim }}/ — render a
      comparison with: python3 benchmarks/render_results.py
