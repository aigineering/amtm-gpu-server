---
# Multi-turn conversation benchmark (vLLM's benchmark_serving_multi_turn.py,
# fetched to the models volume by the fetch playbook). Replays full sessions —
# accumulated history per turn, client think-time, shared prefixes — the
# workload single-shot `vllm bench serve` cannot produce. Swept across the
# same user tiers as the other scenarios; each tier gets its own generated
# conversation set (conversations = clients × factor). All instances stay
# serving; each endpoint is exercised in turn.

- name: "Multi-turn: ensure all instances are running"
  ansible.builtin.command:
    cmd: docker compose start
    chdir: "{{ vllm_deploy_dir }}"
  changed_when: true

- name: "Multi-turn: wait for every endpoint"
  ansible.builtin.command: curl -sf http://localhost:{{ item.port }}/health
  register: benchmark_mt_health
  until: benchmark_mt_health.rc == 0
  retries: 90
  delay: 10
  changed_when: false
  loop: "{{ vllm_instances }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Multi-turn: render a conversation-generation config per tier"
  ansible.builtin.template:
    src: multi_turn_input.json.j2
    dest: "{{ benchmark_run_dir }}/multi_turn_input-c{{ item }}.json"
    mode: "0644"
  vars:
    benchmark_multi_turn_num_conversations: >-
      {{ item | int * benchmark_multi_turn_conversations_per_client | int }}
  loop: "{{ benchmark_multi_turn_tiers }}"

# Baseline metrics snapshot BEFORE any multi-turn load: offload/cache counters
# are cumulative since engine start, so per-tier deltas need a clean zero point
# (earlier scenarios also move these counters).
- name: "Multi-turn: baseline /metrics snapshot (c0)"
  ansible.builtin.shell:
    cmd: >-
      curl -s http://localhost:{{ item.port }}/metrics >
      {{ benchmark_run_dir }}/multiturn-{{ item.name }}-c0.metrics.txt
    creates: "{{ benchmark_run_dir }}/multiturn-{{ item.name }}-c0.metrics.txt"
  changed_when: true
  loop: "{{ vllm_instances }}"
  loop_control:
    label: "{{ item.name }}"

# Runs inside the serving image (has aiohttp/numpy/transformers; pandas and
# xlsxwriter come from the pylibs dir via PYTHONPATH). The harness prints its
# statistics table to stdout, captured per instance and tier.
# The /metrics snapshot is taken INSIDE the same shell, immediately after the
# harness exits — counters are cumulative, so per-tier deltas are only valid
# if each tier's snapshot is captured before the next tier runs (a separate
# post-loop snapshot task produced four identical scrapes of the final state).
- name: "Multi-turn: run each endpoint at each tier (+ immediate metrics snapshot)"
  ansible.builtin.shell: >-
    start_ts=$(date -u +%Y-%m-%dT%H:%M:%SZ);
    docker run --rm --network host
    -v /opt/models:/models:ro
    -v {{ benchmark_run_dir }}:/results:ro
    -w /models/benchmark/multi_turn
    -e PYTHONPATH=/models/benchmark/pylibs
    --entrypoint python3 {{ vllm_image }}
    benchmark_serving_multi_turn.py
    --url http://localhost:{{ item.1.port }}
    --model /models/{{ item.1.model_path | basename }}
    --served-model-name {{ item.1.served_model_name | default(item.1.name) }}
    --input-file /results/multi_turn_input-c{{ item.0 }}.json
    --num-clients {{ item.0 }}
    --max-active-conversations {{ item.0 | int * benchmark_multi_turn_conversations_per_client | int }}
    {% if benchmark_multi_turn_no_early_stop | bool %}--no-early-stop{% endif %}
    {% if vllm_api_key | length > 0 %}--api-key {{ vllm_api_key }}{% endif %}
    > {{ benchmark_run_dir }}/multiturn-{{ item.1.name }}-c{{ item.0 }}.txt 2>&1;
    rc=$?;
    curl -s http://localhost:{{ item.1.port }}/metrics >
    {{ benchmark_run_dir }}/multiturn-{{ item.1.name }}-c{{ item.0 }}.metrics.txt;
    docker logs --since "$start_ts" vllm-{{ item.1.name }} 2>&1
    | grep -oE "GPU KV cache usage: [0-9.]+" | awk '{print $NF}' | sort -n | tail -1
    > {{ benchmark_run_dir }}/multiturn-{{ item.1.name }}-c{{ item.0 }}.kvuse.txt;
    exit $rc
  args:
    # Resumability: the captured output is the completion marker. NOTE: a
    # failed harness run leaves its error text here too — delete the file to
    # retry that instance/tier.
    creates: "{{ benchmark_run_dir }}/multiturn-{{ item.1.name }}-c{{ item.0 }}.txt"
  changed_when: true
  async: 7200
  poll: 15
  loop: "{{ benchmark_multi_turn_tiers | product(vllm_instances) | list }}"
  loop_control:
    label: "{{ item.1.name }} c{{ item.0 }}"
