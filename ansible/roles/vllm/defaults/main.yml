---
vllm_deploy_dir: /opt/vllm

# Pin this once you've validated a version against the models you're running —
# "latest" is a convenience default for initial experimentation only.
vllm_image: "vllm/vllm-openai:latest"

# Instances start strictly one at a time (each waits for the previous one's
# /health) because concurrent vLLM startups corrupt each other's GPU memory
# profiling. This is the grace period compose allows each instance to become
# healthy — cover model load from disk + torch.compile + CUDA graph capture.
# Raise it for very large models or slow disks.
vllm_healthcheck_start_period: "600s"

# When non-empty, every instance requires "Authorization: Bearer <key>" on
# /v1/* (health/metrics stay open). Set via ansible-vault
# (group_vars vault.yml -> vault_vllm_api_key), never in plaintext — the
# inventories wire it as: vllm_api_key: "{{ vault_vllm_api_key | default('') }}".
vllm_api_key: ""

# Optional TLS — both must be set together or neither at all.
# Absolute paths on the HOST to the TLS certificate (PEM) and private key (PEM).
# When set, both files are bind-mounted read-only into every vLLM container and
# passed to vLLM via --ssl-certfile / --ssl-keyfile. Healthchecks switch to HTTPS
# automatically. Leave empty (the default) to keep plain HTTP — no behavior change.
# See docs/vllm-configuration.md for path/permissions guidance and examples.
vllm_tls_cert_file: ""
vllm_tls_key_file: ""

# Each entry:
#   name                    - short identifier, used for container name and mount point
#   model_path               - absolute path on the HOST to a full local HF-format model
#                              repo (config.json, tokenizer files, safetensors) — this
#                              role does not download anything, it only mounts what's
#                              already on disk read-only into the container.
#   served_model_name        - optional, name exposed via the OpenAI-compatible API
#                              (defaults to `name`)
#   port                     - host port to publish
#   gpu_memory_utilization   - fraction of total GPU memory this instance may claim
#   max_model_len             - max context length in tokens
#   extra_args                - list of additional vLLM CLI flags
# See docs/vllm-configuration.md and docs/model-tuning-and-placement.md.
vllm_instances: []
