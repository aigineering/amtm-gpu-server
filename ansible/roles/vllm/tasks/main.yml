---
- name: Assert vllm_instances is configured
  ansible.builtin.assert:
    that:
      - vllm_instances | length > 0
    fail_msg: >-
      vllm_instances is empty. Define at least one instance in
      inventories/<env>/group_vars/all.yml — see docs/vllm-configuration.md.

# Model repos are expected to already exist on the host (copied there out of band) —
# this role only mounts them, it never downloads anything. Validate that expectation
# before rendering compose, rather than letting vLLM fail deep inside a container.
- name: Check each configured model path exists on the host
  ansible.builtin.stat:
    path: "{{ item.model_path }}"
  register: vllm_model_path_check
  loop: "{{ vllm_instances }}"
  loop_control:
    label: "{{ item.name }} ({{ item.model_path }})"

- name: Fail if any configured model path is missing
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
    fail_msg: >-
      model_path {{ item.item.model_path }} for instance '{{ item.item.name }}' does
      not exist or is not a directory on this host. Copy the full model repository
      there before deploying — see docs/model-tuning-and-placement.md.
  loop: "{{ vllm_model_path_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Check each model path contains a full HF-format repo (config.json present)
  ansible.builtin.stat:
    path: "{{ item.model_path }}/config.json"
  register: vllm_model_config_check
  loop: "{{ vllm_instances }}"
  loop_control:
    label: "{{ item.name }}"

- name: Fail if config.json is missing (looks like weights-only, not a full repo)
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      {{ item.item.model_path }} has no config.json. This role expects the FULL
      Hugging Face repo (config.json, tokenizer files, generation_config.json,
      safetensors) at model_path, not just raw weight files — see
      docs/model-tuning-and-placement.md.
  loop: "{{ vllm_model_config_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# GPU capacity preflight: the customer's GPU may already be running other workloads
# before this playbook ever touches the box. This is read-only detection (no gate
# needed) but must run before we commit to a memory split. See
# docs/host-safety-model.md.
- name: List existing GPU compute processes
  ansible.builtin.command: nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv,noheader
  register: gpu_compute_apps
  changed_when: false
  # Read-only detection must run even under --check, or every downstream
  # fact is computed from a skipped, empty register.
  check_mode: false
  failed_when: false

- name: Report existing GPU compute processes
  ansible.builtin.debug:
    msg: >-
      GPU processes already running outside this playbook:
      {{ gpu_compute_apps.stdout_lines if gpu_compute_apps.stdout_lines | length > 0 else ['none'] }}

- name: Check current GPU memory usage
  ansible.builtin.command: nvidia-smi --query-gpu=memory.total,memory.used --format=csv,noheader,nounits
  register: gpu_memory_check
  changed_when: false
  # Read-only detection must run even under --check, or every downstream
  # fact is computed from a skipped, empty register.
  check_mode: false

# A re-apply recreates this deployment's own vLLM containers, so GPU memory
# they hold right now is NOT real contention — without excluding it, every
# config change on a healthy serving box trips the overcommit guard against
# our own workload. Only processes outside this compose project count.
- name: Measure GPU memory used by processes outside this deployment
  ansible.builtin.shell: |
    set -o pipefail
    our_pids=$(docker ps --filter "label=com.docker.compose.project={{ vllm_deploy_dir | basename }}" -q \
      | xargs -r -I{} docker top {} -eo pid 2>/dev/null | grep -E '^ *[0-9]+ *$' || true)
    nvidia-smi --query-compute-apps=pid,used_memory --format=csv,noheader,nounits \
      | awk -F', *' -v pids="$our_pids" '
          BEGIN { n = split(pids, a, /[[:space:]]+/); for (i = 1; i <= n; i++) own[a[i]] = 1 }
          $1 != "" && !($1 + 0 in own) { s += $2 }
          END { print s + 0 }'
  register: gpu_foreign_memory_check
  changed_when: false
  # Read-only detection must run even under --check.
  check_mode: false
  failed_when: false

- name: Parse GPU memory facts
  ansible.builtin.set_fact:
    gpu_memory_total_mib: "{{ gpu_memory_check.stdout_lines[0].split(',')[0] | trim | int }}"
    gpu_memory_used_mib: "{{ gpu_memory_check.stdout_lines[0].split(',')[1] | trim | int }}"
    # Fall back to total used (conservative) if the exclusion pipeline failed.
    gpu_memory_foreign_mib: >-
      {{ (gpu_foreign_memory_check.stdout | trim | int)
         if (gpu_foreign_memory_check.rc | default(1)) == 0
         else (gpu_memory_check.stdout_lines[0].split(',')[1] | trim | int) }}

- name: Compute requested vs. foreign GPU memory
  ansible.builtin.set_fact:
    gpu_memory_foreign_fraction: "{{ (gpu_memory_foreign_mib | float) / (gpu_memory_total_mib | float) }}"
    gpu_memory_requested_fraction: "{{ vllm_instances | map(attribute='gpu_memory_utilization') | map('float') | sum }}"

- name: Report GPU memory budget
  ansible.builtin.debug:
    msg: >-
      GPU memory in use: {{ gpu_memory_used_mib }} MiB / {{ gpu_memory_total_mib }} MiB total;
      {{ gpu_memory_foreign_mib }} MiB
      ({{ (gpu_memory_foreign_fraction | float * 100) | round(1) }}%) belongs to processes
      OUTSIDE this deployment (own vLLM containers excluded — they are recreated by the
      apply). vllm_instances request a combined
      {{ (gpu_memory_requested_fraction | float * 100) | round(1) }}% of total GPU memory.

- name: Fail if foreign usage plus requested vLLM memory would overcommit the GPU
  ansible.builtin.assert:
    that: (gpu_memory_foreign_fraction | float) + (gpu_memory_requested_fraction | float) <= 0.97
    fail_msg: >-
      GPU usage by processes outside this deployment
      ({{ (gpu_memory_foreign_fraction | float * 100) | round(1) }}%) plus the requested
      vllm_instances memory utilization
      ({{ (gpu_memory_requested_fraction | float * 100) | round(1) }}%) would overcommit
      the GPU. Reduce gpu_memory_utilization values in group_vars, or investigate what
      else is using the GPU (see the process list reported above) before proceeding.

- name: Ensure vLLM deploy directory exists
  ansible.builtin.file:
    path: "{{ vllm_deploy_dir }}"
    state: directory
    mode: "0755"

# 0600: the rendered file may embed VLLM_API_KEY.
- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ vllm_deploy_dir }}/docker-compose.yml"
    mode: "0600"
  register: vllm_compose_render

# On a config change, tear the old deployment down and WAIT for the GPU to
# actually release its memory before starting the new one. Without this, the
# new engine can profile free memory while the old ~40GB process is still
# releasing, and silently budget a crippled KV pool (observed: an 8k profile
# booting with a 46k-token pool instead of ~190k). Unchanged config skips
# this — idempotent re-applies keep warm containers.
- name: Tear down the previous deployment before a config change
  ansible.builtin.command:
    cmd: docker compose down --remove-orphans
    chdir: "{{ vllm_deploy_dir }}"
  when: vllm_compose_render is changed
  changed_when: true
  failed_when: false  # first-ever deploy: nothing to tear down

- name: Wait for the GPU to release the previous deployment's memory
  ansible.builtin.shell: |
    set -o pipefail
    used=$(nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits | head -1)
    echo "gpu used: ${used} MiB"
    test "$used" -le {{ (gpu_memory_foreign_mib | default(0) | int) + 1500 }}
  register: vllm_gpu_drain
  until: vllm_gpu_drain.rc == 0
  retries: 36
  delay: 5
  changed_when: false
  when: vllm_compose_render is changed

# wait: true blocks until every service's compose healthcheck reports healthy
# (i.e. models are LOADED and serving), not merely started. Without it, the
# apply returns while engines are still loading: a crash-during-load surfaces
# minutes later as an opaque health-wait timeout in the benchmark instead of a
# clear apply failure, and CI step timings misattribute model-load time.
- name: Deploy vLLM services
  community.docker.docker_compose_v2:
    project_src: "{{ vllm_deploy_dir }}"
    state: present
    remove_orphans: true
    wait: true
    # Must cover serial startup of all instances (each up to
    # vllm_healthcheck_start_period) plus image pull on a fresh box.
    wait_timeout: 1800
