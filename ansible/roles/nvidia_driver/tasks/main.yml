---
# Detect-then-install: this role must never assume the driver is absent. Customer
# servers may have a driver installed outside of Ansible before this repo ever ran.
# See ../../../docs/nvidia-driver-management.md for the full rationale.

- name: Check for existing NVIDIA driver via nvidia-smi
  ansible.builtin.command: nvidia-smi --query-gpu=driver_version --format=csv,noheader
  register: nvidia_smi_check
  changed_when: false
  # Read-only detection must run even under --check, or every downstream
  # fact is computed from a skipped, empty register.
  check_mode: false
  failed_when: false

- name: Set driver detection facts
  ansible.builtin.set_fact:
    nvidia_driver_detected: "{{ nvidia_smi_check.rc == 0 }}"
    nvidia_driver_current_version: >-
      {{ (nvidia_smi_check.stdout_lines[0] | default('')) | trim }}

- name: Report detected driver state
  ansible.builtin.debug:
    msg: >-
      NVIDIA driver detected: {{ nvidia_driver_detected }}{{
      ' (version ' ~ nvidia_driver_current_version ~ ')' if nvidia_driver_detected else '' }}

# The empty-string guard keeps the version test from exploding if nvidia-smi
# ever succeeds but prints nothing parseable — treated as needs-install.
- name: Determine whether install/upgrade is needed
  ansible.builtin.set_fact:
    nvidia_driver_needs_install: >-
      {{ not nvidia_driver_detected or
         (nvidia_driver_current_version | length == 0) or
         (nvidia_driver_current_version is version(nvidia_driver_min_version, '<')) }}

- name: Fail if driver missing/outdated and management is disabled
  ansible.builtin.fail:
    msg: >-
      NVIDIA driver is
      {{ 'missing' if not nvidia_driver_detected else
      'below the minimum version (' ~ nvidia_driver_current_version ~ ' < ' ~ nvidia_driver_min_version ~ ')' }}
      and nvidia_driver_manage is false, so this role will not install/upgrade it.
      Review docs/nvidia-driver-management.md, confirm the intended version with the
      server owner, then set nvidia_driver_manage: true for this environment if
      installation should proceed.
  when:
    - nvidia_driver_needs_install
    - not nvidia_driver_manage

- name: Install or upgrade NVIDIA driver
  when:
    - nvidia_driver_needs_install
    - nvidia_driver_manage
  block:
    # dnf config-manager (libcurl) instead of get_url: the target's Python ssl
    # stack intermittently fails against the NVIDIA CDN with
    # "[ASN1: NOT_ENOUGH_DATA]". This is also NVIDIA's documented install method.
    # dnf-plugins-core (provides config-manager) is installed by the common role.
    - name: Add NVIDIA CUDA repo (RHEL 9)
      ansible.builtin.command:
        cmd: dnf config-manager --add-repo {{ nvidia_driver_repo_url }}
        creates: /etc/yum.repos.d/cuda-rhel9.repo
      register: nvidia_repo_add
      retries: 3
      delay: 5
      until: nvidia_repo_add is not failed

    # The DKMS variant of the NVIDIA kernel module requires dkms, which RHEL 9
    # only provides via EPEL — the CUDA repo itself doesn't ship it ("nothing
    # provides dkms >= 3.1.8" at depsolve otherwise).
    #
    # Installed via the dnf CLI, NOT the ansible dnf module or rpm_key/get_url:
    # every one of those downloads URL arguments through the target's Python ssl
    # stack first, which intermittently fails with "[ASN1: NOT_ENOUGH_DATA]"
    # (same issue as the CUDA repo task above). The dnf CLI fetches with
    # libcurl, which works. dnf's default localpkg_gpgcheck=false applies to
    # this bootstrap rpm only — it installs the EPEL signing key, and every
    # package later installed FROM EPEL is verified against it as usual.
    - name: Check whether epel-release is installed
      ansible.builtin.command: rpm -q epel-release
      register: epel_check
      changed_when: false
      # Read-only detection must run even under --check, or every downstream
      # fact is computed from a skipped, empty register.
      check_mode: false
      failed_when: false

    - name: Install EPEL repo (provides dkms)
      ansible.builtin.command:
        cmd: dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm
      register: epel_install
      retries: 3
      delay: 5
      until: epel_install is not failed
      changed_when: true
      when: epel_check.rc != 0

    - name: Install NVIDIA kernel module (open dkms) and userspace driver
      ansible.builtin.dnf:
        name:
          - "kmod-nvidia-open-dkms"
          - "nvidia-driver"
          - "nvidia-driver-cuda"
        state: present
      register: nvidia_driver_install

    - name: Flag that a reboot is required to load the new kernel module
      ansible.builtin.set_fact:
        nvidia_driver_reboot_required: "{{ nvidia_driver_install.changed }}"

- name: Report reboot requirement
  ansible.builtin.debug:
    msg: >-
      A reboot is required before the new NVIDIA kernel module is active and the GPU
      is usable by containers. This role does NOT reboot automatically — reboot the
      host manually, then re-run the playbook to continue with Docker/vLLM setup.
  when: nvidia_driver_reboot_required | default(false)

- name: Stop this run here until the required reboot has happened
  ansible.builtin.meta: end_host
  when: nvidia_driver_reboot_required | default(false)
