---
common_packages:
  - dnf-plugins-core
  - kernel-devel
  - kernel-headers
  - gcc
  - make
  - curl
  - tar

# Master switch for firewalld. If false (the safe default) and firewalld isn't
# already active, the whole firewall area is skipped with a notice — the host may
# legitimately rely on a security group or external firewall instead. If true, the
# package is installed and the service started/enabled (idempotently, even if
# already running). Rules (ssh explicitly, so a fresh enable can't lock out the
# playbook's own SSH access, plus the vLLM ports) are applied whenever firewalld
# is active, managed or not. See docs/host-safety-model.md.
firewalld_manage: false
