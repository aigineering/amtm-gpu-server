---
common_packages:
  - dnf-plugins-core
  - kernel-devel
  - kernel-headers
  - gcc
  - make
  - curl
  - tar

# Master switch for firewalld. If false (the safe default), this role never enables
# or starts firewalld on a host where it isn't already active — it only adds the
# vLLM port rules if firewalld is already the host's active firewall manager. See
# docs/host-safety-model.md.
firewalld_manage: false
