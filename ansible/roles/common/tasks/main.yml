---
- name: Assert target is RHEL 9
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "RedHat"
      - ansible_facts['distribution_major_version'] == "9"
    fail_msg: >-
      This repo targets RHEL 9. Detected
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
    success_msg: "RHEL 9 confirmed."

- name: Install base packages
  ansible.builtin.dnf:
    name: "{{ common_packages }}"
    state: present

# firewalld: detect-then-manage, same pattern as the NVIDIA driver. A customer host
# may intentionally run without firewalld (relying on a cloud security group or an
# external firewall instead) — enabling it fresh could drop traffic that currently
# flows freely. See docs/host-safety-model.md.
- name: Check whether firewalld is currently active
  ansible.builtin.command: systemctl is-active firewalld
  register: firewalld_active_check
  changed_when: false
  # Read-only detection must run even under --check, or every downstream
  # fact is computed from a skipped, empty register.
  check_mode: false
  failed_when: false

- name: Set firewalld detection facts
  ansible.builtin.set_fact:
    firewalld_currently_active: "{{ firewalld_active_check.stdout == 'active' }}"

- name: Report firewalld state
  ansible.builtin.debug:
    msg: "firewalld currently active: {{ firewalld_currently_active }}"

# When firewalld_manage is true, ensure the full desired state (package present,
# service running and enabled) regardless of what detection found — all three
# tasks are idempotent no-ops on a host that already has them.
- name: Install and enable firewalld
  when: firewalld_manage
  block:
    - name: Install firewalld package
      ansible.builtin.dnf:
        name: firewalld
        state: present

    - name: Start and enable firewalld
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Firewalld is now active for this run
      ansible.builtin.set_fact:
        firewalld_currently_active: true

- name: Skip firewall configuration (firewalld inactive and firewalld_manage is false)
  ansible.builtin.debug:
    msg: >-
      firewalld is not active on this host and firewalld_manage is false, so it will
      not be installed/enabled. Ensure vLLM ports
      ({{ vllm_instances | map(attribute='port') | join(', ') }}) are reachable through
      whatever mechanism this host actually uses (security group, external firewall,
      etc). Set firewalld_manage: true to have this role manage it instead.
  when: not firewalld_currently_active

# Explicitly allow SSH before anything else: this playbook's only access path to
# the host is SSH, so if firewalld was just enabled fresh (or its zone config
# doesn't include the ssh service), this guarantees we can't lock ourselves out.
- name: Ensure SSH is allowed in firewalld
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    immediate: true
    state: enabled
  when: firewalld_currently_active

- name: Open vLLM instance ports in firewalld
  ansible.posix.firewalld:
    port: "{{ item.port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ vllm_instances }}"
  loop_control:
    label: "{{ item.name }} ({{ item.port }}/tcp)"
  when: firewalld_currently_active
